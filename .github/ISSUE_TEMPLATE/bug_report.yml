name: Bug report
description: Report a reproducible MassPanel problem without sensitive data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, cookies, private keys, customer data or security vulnerabilities.
  - type: input
    id: version
    attributes:
      label: MassPanel version
      placeholder: 2026.08.28.10
    validations:
      required: true
  - type: input
    id: ubuntu
    attributes:
      label: Ubuntu version
      placeholder: Ubuntu 24.04 LTS
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and customer data, and this is not a security vulnerability.
          required: true
