limit_req_zone $binary_remote_addr zone=license_api:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=license_admin:10m rate=10r/m;

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;
  server_tokens off;
  client_max_body_size 32k;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location = / {
    limit_req zone=license_admin burst=20 nodelay;
    allow 10.10.10.0/24;
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location ^~ /admin/ {
    limit_req zone=license_admin burst=20 nodelay;
    allow 10.10.10.0/24;
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location ^~ /v1/ {
    limit_req zone=license_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
  }

  location ^~ /releases/ {
    root /srv/masspanel-updates;
    autoindex off;
    limit_except GET { deny all; }
    default_type application/octet-stream;
    types { application/json json; application/gzip gz; }
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /releases/beta/manifest.json {
    root /srv/masspanel-updates;
    default_type application/json;
    limit_except GET { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
  }
}
