location = /_masspanel_file_auth {
    internal;
    proxy_pass http://127.0.0.1:8100/api/tool-auth/files;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}

location = /_masspanel_database_auth {
    internal;
    proxy_pass http://127.0.0.1:8100/api/tool-auth/database;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /file-tool/ {
    auth_request /_masspanel_file_auth;
    auth_request_set $masspanel_file_user $upstream_http_x_masspanel_user;
    auth_request_set $masspanel_file_role $upstream_http_x_masspanel_role;
    proxy_pass http://unix:/run/masspanel-filebrowser/filebrowser.sock:;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-User $masspanel_file_user;
    proxy_set_header X-MassPanel-Groups $masspanel_file_role;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
    client_max_body_size 2g;
}

location ^~ /database-tool/ {
    auth_request /_masspanel_database_auth;
    auth_request_set $masspanel_db_server $upstream_http_x_masspanel_db_server;
    auth_request_set $masspanel_db_name $upstream_http_x_masspanel_db_name;
    auth_request_set $masspanel_db_user $upstream_http_x_masspanel_db_user;
    auth_request_set $masspanel_db_password $upstream_http_x_masspanel_db_password;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/masspanel/tools/adminneo/index.php;
    fastcgi_param SCRIPT_NAME /database-tool/index.php;
    fastcgi_param HTTP_X_MASSPANEL_AUTHORIZED 1;
    fastcgi_param HTTP_X_MASSPANEL_DB_SERVER $masspanel_db_server;
    fastcgi_param HTTP_X_MASSPANEL_DB_NAME $masspanel_db_name;
    fastcgi_param HTTP_X_MASSPANEL_DB_USER $masspanel_db_user;
    fastcgi_param HTTP_X_MASSPANEL_DB_PASSWORD $masspanel_db_password;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}
