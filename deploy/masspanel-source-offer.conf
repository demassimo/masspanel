location = /masspanel-source {
    alias /usr/share/doc/masspanel/masspanel-source.html;
    default_type text/html;
}
location = /masspanel-corresponding-source.tar.gz {
    alias /usr/share/masspanel/source/masspanel-corresponding-source.tar.gz;
    default_type application/gzip;
    add_header Content-Disposition 'attachment; filename="masspanel-corresponding-source.tar.gz"';
}
location = /masspanel-open-source-license {
    alias /usr/share/doc/masspanel/LICENSE;
    default_type text/plain;
}
sub_filter_once off;
sub_filter '</body>' '<a href="/masspanel-source" style="position:fixed;right:12px;bottom:10px;z-index:2147483647;padding:6px 10px;border-radius:5px;background:#071d3a;color:#fff;font:12px system-ui;text-decoration:none">Source code &amp; licences</a></body>';
