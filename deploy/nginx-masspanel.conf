server {
 listen 8443 ssl default_server;listen [::]:8443 ssl default_server;server_name _;
 ssl_certificate /etc/masspanel/tls/masspanel.crt;ssl_certificate_key /etc/masspanel/tls/masspanel.key;ssl_protocols TLSv1.2 TLSv1.3;ssl_session_tickets off;
 root /opt/masspanel/frontend;index index.html;client_max_body_size 64m;
 add_header Content-Security-Policy "default-src 'self';base-uri 'self';object-src 'none';frame-ancestors 'none';form-action 'self';script-src 'self';style-src 'self';img-src 'self' data:;connect-src 'self'" always;
 add_header X-Content-Type-Options nosniff always;add_header X-Frame-Options DENY always;add_header Referrer-Policy no-referrer always;
 location = /masspanel-source {alias /usr/share/doc/masspanel/masspanel-source.html;default_type text/html;}
 location = /masspanel-corresponding-source.tar.gz {alias /usr/share/masspanel/source/masspanel-corresponding-source.tar.gz;default_type application/gzip;add_header Content-Disposition 'attachment; filename="masspanel-corresponding-source.tar.gz"';}
 location = /masspanel-open-source-license {alias /usr/share/doc/masspanel/LICENSE;default_type text/plain;}
 location /api/ {proxy_pass http://127.0.0.1:8100;proxy_http_version 1.1;proxy_set_header Host $host;proxy_set_header X-Real-IP $remote_addr;proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;proxy_set_header X-Forwarded-Proto https;proxy_read_timeout 600s;}
 location = /index.html {add_header Cache-Control "no-store" always;try_files $uri =404;}
 location /assets/ {add_header Cache-Control "public, immutable, max-age=31536000" always;try_files $uri =404;}
 location / {add_header Cache-Control "no-store" always;try_files $uri $uri/ /index.html;}
}
server {
 listen 80 default_server;listen [::]:80 default_server;listen 443 ssl http2 default_server;listen [::]:443 ssl http2 default_server;server_name _;
 ssl_certificate /etc/masspanel/tls/masspanel.crt;ssl_certificate_key /etc/masspanel/tls/masspanel.key;root /var/www/masspanel-default;index index.html;
 location / {try_files $uri $uri/ =404;}
}
